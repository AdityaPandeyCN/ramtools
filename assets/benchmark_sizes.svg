<svg xmlns="http://www.w3.org/2000/svg" width="720" height="372" viewBox="0 0 720 372" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Helvetica, Arial, sans-serif" font-size="13">
  <title>File size of HG00154 in each format, in GB</title>
  <rect width="720" height="372" fill="#fcfcfb" rx="6"/>
  <text x="24" y="30" font-size="15" font-weight="600" fill="#0b0b0b">HG00154, 196 million reads: file size in GB</text>
  <text x="24" y="50" fill="#52514e">Smaller is better. RAM in blue, samtools formats in orange. Uncompressed RAM (83.7 GB) not shown.</text>

  <g fill="#52514e" text-anchor="end">
    <text x="214" y="88">SAM</text>
    <text x="214" y="120">RAM, LZ4 4</text>
    <text x="214" y="152">BAM</text>
    <text x="214" y="184">RAM, ZLIB 1</text>
    <text x="214" y="216">RAM, ZSTD 5 (default)</text>
    <text x="214" y="248">CRAM + reference FASTA</text>
    <text x="214" y="280">RAM, ZSTD 9</text>
    <text x="214" y="312">CRAM</text>
  </g>

  <!-- 430 px = 72.06 GB; bars 20 px thick, rounded at the data end, square at the baseline -->
  <g>
    <path d="M226 74 h426.0 a4 4 0 0 1 4 4 v12 a4 4 0 0 1 -4 4 h-426.0 z" fill="#eb6834"/>
    <path d="M226 106 h94.7 a4 4 0 0 1 4 4 v12 a4 4 0 0 1 -4 4 h-94.7 z" fill="#2a78d6"/>
    <path d="M226 138 h86.8 a4 4 0 0 1 4 4 v12 a4 4 0 0 1 -4 4 h-86.8 z" fill="#eb6834"/>
    <path d="M226 170 h80.4 a4 4 0 0 1 4 4 v12 a4 4 0 0 1 -4 4 h-80.4 z" fill="#2a78d6"/>
    <path d="M226 202 h64.2 a4 4 0 0 1 4 4 v12 a4 4 0 0 1 -4 4 h-64.2 z" fill="#2a78d6"/>
    <path d="M226 234 h61.2 a4 4 0 0 1 4 4 v12 a4 4 0 0 1 -4 4 h-61.2 z" fill="#eb6834"/>
    <path d="M226 266 h57.9 a4 4 0 0 1 4 4 v12 a4 4 0 0 1 -4 4 h-57.9 z" fill="#2a78d6"/>
    <path d="M226 298 h42.4 a4 4 0 0 1 4 4 v12 a4 4 0 0 1 -4 4 h-42.4 z" fill="#eb6834"/>
  </g>

  <g fill="#0b0b0b">
    <text x="664.0" y="88">72.06</text>
    <text x="332.7" y="120">16.54</text>
    <text x="324.8" y="152">15.22</text>
    <text x="318.4" y="184">14.14</text>
    <text x="302.2" y="216">11.43</text>
    <text x="299.2" y="248">10.93</text>
    <text x="295.9" y="280">10.38</text>
    <text x="280.4" y="312">7.77</text>
  </g>

  <line x1="226" y1="70" x2="226" y2="322" stroke="#d8d6cf" stroke-width="1"/>
  <text x="24" y="352" fill="#52514e" font-size="12">CRAM cannot be read without its reference; the combined row is a self-contained copy. RAM and BAM need no other file.</text>
</svg>
